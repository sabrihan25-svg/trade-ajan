name: Kurul testi
# Elle calistirilir: Actions > Kurul testi > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kurul-testi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sahte veri testleri
        run: python -m unittest discover -s testler -t .
      - name: Uc model ve veri kaynaklari
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m beyin.kurul_testi
